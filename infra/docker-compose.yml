services:
  mysql:
    image: mysql:8.4
    container_name: failforward-mysql
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-failforward}
      MYSQL_USER: ${MYSQL_USER:-failforward}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-failforward}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: failforward-backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: ${SERVER_PORT:-8081}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/failforward?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-failforward}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-failforward}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-sidepick-development-jwt-secret-key-must-be-32-bytes}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4173,http://127.0.0.1:4173,http://localhost:4174,http://127.0.0.1:4174,http://localhost:5173,http://127.0.0.1:5173}
      APP_FILE_STORAGE_UPLOAD_DIR: ${APP_FILE_STORAGE_UPLOAD_DIR:-/app/uploads}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai-server:8001}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8081:8081"

  ai-server:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: failforward-ai-server
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8001:8001"

  nginx:
    image: nginx:1.27-alpine
    container_name: failforward-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - ai-server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"

volumes:
  mysql_data:
  backend_uploads:
