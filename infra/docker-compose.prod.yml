services:
  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: sidepick-backend:prod
    container_name: sidepick-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://localhost:8000}
      APP_EMAIL_VERIFICATION_EXPIRATION_MINUTES: ${APP_EMAIL_VERIFICATION_EXPIRATION_MINUTES:-10}
      APP_EMAIL_VERIFICATION_EXPOSE_CODE: ${APP_EMAIL_VERIFICATION_EXPOSE_CODE:-false}
      APP_AUTH_LOCAL_ENABLED: ${APP_AUTH_LOCAL_ENABLED:-false}
      APP_AUTH_KAKAO_ENABLED: ${APP_AUTH_KAKAO_ENABLED:-true}
      APP_AUTH_GOOGLE_ENABLED: ${APP_AUTH_GOOGLE_ENABLED:-false}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM_ADDRESS: ${APP_MAIL_FROM_ADDRESS:-}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-Sidepick}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:-false}
      SPRING_MAIL_SMTP_CONNECTION_TIMEOUT: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:-5000}
      SPRING_MAIL_SMTP_TIMEOUT: ${SPRING_MAIL_SMTP_TIMEOUT:-5000}
      SPRING_MAIL_SMTP_WRITE_TIMEOUT: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:-5000}
      APP_OAUTH_KAKAO_CLIENT_ID: ${APP_OAUTH_KAKAO_CLIENT_ID:-}
      APP_OAUTH_KAKAO_CLIENT_SECRET: ${APP_OAUTH_KAKAO_CLIENT_SECRET:-}
      APP_OAUTH_GOOGLE_CLIENT_ID: ${APP_OAUTH_GOOGLE_CLIENT_ID:-}
      APP_OAUTH_GOOGLE_CLIENT_SECRET: ${APP_OAUTH_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8081"
