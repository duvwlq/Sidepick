services:
  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: sidepick-backend:prod
    container_name: sidepick-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai-server:8001}
      APP_EMAIL_VERIFICATION_EXPIRATION_MINUTES: ${APP_EMAIL_VERIFICATION_EXPIRATION_MINUTES:-10}
      APP_EMAIL_VERIFICATION_EXPOSE_CODE: ${APP_EMAIL_VERIFICATION_EXPOSE_CODE:-false}
      APP_AUTH_LOCAL_ENABLED: ${APP_AUTH_LOCAL_ENABLED:-false}
      APP_AUTH_KAKAO_ENABLED: ${APP_AUTH_KAKAO_ENABLED:-true}
      APP_AUTH_GOOGLE_ENABLED: ${APP_AUTH_GOOGLE_ENABLED:-false}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM_ADDRESS: ${APP_MAIL_FROM_ADDRESS:-}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-Sidepick}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:-false}
      SPRING_MAIL_SMTP_CONNECTION_TIMEOUT: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:-5000}
      SPRING_MAIL_SMTP_TIMEOUT: ${SPRING_MAIL_SMTP_TIMEOUT:-5000}
      SPRING_MAIL_SMTP_WRITE_TIMEOUT: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:-5000}
      APP_OAUTH_KAKAO_CLIENT_ID: ${APP_OAUTH_KAKAO_CLIENT_ID:-}
      APP_OAUTH_KAKAO_CLIENT_SECRET: ${APP_OAUTH_KAKAO_CLIENT_SECRET:-}
      APP_OAUTH_GOOGLE_CLIENT_ID: ${APP_OAUTH_GOOGLE_CLIENT_ID:-}
      APP_OAUTH_GOOGLE_CLIENT_SECRET: ${APP_OAUTH_GOOGLE_CLIENT_SECRET:-}
      APP_EXPERIENCE_IMPORT_ENABLED: ${APP_EXPERIENCE_IMPORT_ENABLED:-false}
      APP_EXPERIENCE_IMPORT_CSV_PATH: ${APP_EXPERIENCE_IMPORT_CSV_PATH:-}
      APP_EXPERIENCE_IMPORT_PRESERVE_IDS: ${APP_EXPERIENCE_IMPORT_PRESERVE_IDS:-true}
      APP_EXPERIENCE_IMPORT_OVERWRITE_EXISTING: ${APP_EXPERIENCE_IMPORT_OVERWRITE_EXISTING:-true}
      APP_EXPERIENCE_IMPORT_ANALYSIS: ${APP_EXPERIENCE_IMPORT_ANALYSIS:-true}
      APP_EXPERIENCE_IMPORT_REPLACE_MODE: ${APP_EXPERIENCE_IMPORT_REPLACE_MODE:-UPSERT_ONLY}
      APP_EXPERIENCE_IMPORT_AUTHOR_MODE: ${APP_EXPERIENCE_IMPORT_AUTHOR_MODE:-SYSTEM}
      APP_EXPERIENCE_IMPORT_SYSTEM_EMAIL: ${APP_EXPERIENCE_IMPORT_SYSTEM_EMAIL:-imported-cases@sidepick.local}
      APP_EXPERIENCE_IMPORT_SYSTEM_NICKNAME: ${APP_EXPERIENCE_IMPORT_SYSTEM_NICKNAME:-sidepick-import}
      APP_EXPERIENCE_IMPORT_PSEUDO_EMAIL_DOMAIN: ${APP_EXPERIENCE_IMPORT_PSEUDO_EMAIL_DOMAIN:-sidepick.local}
      APP_EXPERIENCE_IMPORT_TITLE_MODE: ${APP_EXPERIENCE_IMPORT_TITLE_MODE:-SUMMARY}
      APP_EXPERIENCE_IMPORT_CREATED_AT_MODE: ${APP_EXPERIENCE_IMPORT_CREATED_AT_MODE:-RANDOM_DISTRIBUTED}
      APP_EXPERIENCE_IMPORT_CREATED_AT_START: ${APP_EXPERIENCE_IMPORT_CREATED_AT_START:-2025-01-01T00:00:00}
      APP_EXPERIENCE_IMPORT_CREATED_AT_END: ${APP_EXPERIENCE_IMPORT_CREATED_AT_END:-2026-04-30T23:59:59}
      APP_EXPERIENCE_IMPORT_DEFAULT_AGE_GROUP: ${APP_EXPERIENCE_IMPORT_DEFAULT_AGE_GROUP:-30s}
      APP_EXPERIENCE_IMPORT_DEFAULT_RISK_LEVEL: ${APP_EXPERIENCE_IMPORT_DEFAULT_RISK_LEVEL:-MEDIUM}
      APP_EXPERIENCE_IMPORT_DEFAULT_CATEGORY_ID: ${APP_EXPERIENCE_IMPORT_DEFAULT_CATEGORY_ID:-5}
      APP_DEMO_SEED_ENABLED: ${APP_DEMO_SEED_ENABLED:-false}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8081"

  ai-server:
    build:
      context: ../ai
      dockerfile: Dockerfile
    image: sidepick-ai-server:prod
    container_name: sidepick-ai-server
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:${AI_SERVER_PORT:-8001}:8001"

  nginx:
    image: nginx:1.27-alpine
    container_name: sidepick-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - ai-server
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_SSL_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
