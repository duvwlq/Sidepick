version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.19.0
        - nvm use 20.19.0
        - node -v
        - cd fe
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: fe/dist
    files:
      - '**/*'
  cache:
    paths:
      - fe/node_modules/**/*
