version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.19.0
        - nvm use 20.19.0
        - node -v
        - cd fe
        - npm install
    build:
      commands:
        - npm run build
    postBuild:
      commands:
        - cp dist/index.html dist/404.html
        - cp dist/index.html dist/200.html
  artifacts:
    baseDirectory: fe/dist
    files:
      - '**/*'
  cache:
    paths:
      - fe/node_modules/**/*
