openapi: 3.0.3
info:
  title: Sidepick Advanced API Draft
  version: 0.1.0
  description: >
    BE-03 고도화 API 명세 초안. 현재 구현 API와 목표 API 중 우선순위가 높은
    엔드포인트를 Swagger 기준으로 정리한 문서다.
servers:
  - url: /api
tags:
  - name: Auth
  - name: Users
  - name: Experiences
  - name: Reports
  - name: Statistics
  - name: Agents
  - name: Notifications
  - name: Guides
security:
  - bearerAuth: []
paths:
  /auth/oauth/naver:
    post:
      tags: [Auth]
      summary: 네이버 OAuth 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/providers:
    get:
      tags: [Auth]
      summary: 활성화된 소셜 로그인 목록 조회
      security: []
      responses:
        '200':
          description: provider 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListResponse'
  /users/me:
    get:
      tags: [Users]
      summary: 내 정보 조회
      responses:
        '200':
          description: 현재 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
    patch:
      tags: [Users]
      summary: 내 정보 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 수정된 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
  /users/me/analysis-history:
    get:
      tags: [Users]
      summary: 내 분석 히스토리 조회
      responses:
        '200':
          description: 히스토리 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisHistoryListResponse'
  /experiences:
    get:
      tags: [Experiences]
      summary: 경험 목록 조회
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 경험 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceListResponse'
    post:
      tags: [Experiences]
      summary: 경험 작성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperienceRequest'
      responses:
        '201':
          description: 경험 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceDetailResponse'
  /experiences/{experienceId}:
    get:
      tags: [Experiences]
      summary: 경험 상세 조회
      parameters:
        - $ref: '#/components/parameters/ExperienceId'
      responses:
        '200':
          description: 경험 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceDetailResponse'
    patch:
      tags: [Experiences]
      summary: 경험 수정
      parameters:
        - $ref: '#/components/parameters/ExperienceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExperienceRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceDetailResponse'
    delete:
      tags: [Experiences]
      summary: 경험 삭제
      parameters:
        - $ref: '#/components/parameters/ExperienceId'
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlyResponse'
  /experiences/{experienceId}/images:
    post:
      tags: [Experiences]
      summary: 경험 이미지 등록
      parameters:
        - $ref: '#/components/parameters/ExperienceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceImageCreateRequest'
      responses:
        '201':
          description: 이미지 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceImageResponse'
  /success-cases:
    get:
      tags: [Experiences]
      summary: 성공사례 목록 조회
      responses:
        '200':
          description: 성공사례 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCaseListResponse'
    post:
      tags: [Experiences]
      summary: 성공사례 등록
      responses:
        '201':
          description: 성공사례 등록 성공
  /reports/{experienceId}/success-comparison:
    get:
      tags: [Reports]
      summary: 실패-성공 비교 리포트 조회
      parameters:
        - $ref: '#/components/parameters/ExperienceId'
      responses:
        '200':
          description: 비교 리포트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessComparisonResponse'
  /stats/failure-pattern:
    get:
      tags: [Statistics]
      summary: 개인 실패패턴 그래프 조회
      parameters:
        - in: query
          name: caseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 실패패턴 그래프 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailurePatternResponse'
  /stats/failure-timeline:
    get:
      tags: [Statistics]
      summary: 실패 시점 분포 조회
      parameters:
        - in: query
          name: category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 실패 시점 분포 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureTimelineResponse'
  /stats/category-stats:
    get:
      tags: [Statistics]
      summary: 업종별 통계 조회
      parameters:
        - in: query
          name: category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 통계 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryStatisticsResponse'
  /stats/all-categories:
    get:
      tags: [Statistics]
      summary: 7개 카테고리 통계 요약 조회
      responses:
        '200':
          description: 카테고리 통계 요약 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllCategoryStatisticsResponse'
  /agents/a/questions:
    post:
      tags: [Agents]
      summary: 에이전트 A 질문 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentAQuestionRequest'
      responses:
        '200':
          description: 질문 카드 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAQuestionResponse'
  /agents/c/chat:
    post:
      tags: [Agents]
      summary: 에이전트 C 단일턴 상담
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCChatRequest'
      responses:
        '200':
          description: 상담 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCChatResponse'
  /agents/pre-start-warning:
    post:
      tags: [Agents]
      summary: 부업 시작 전 실패 조심 안내
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreStartWarningRequest'
      responses:
        '200':
          description: 실패 조심 안내 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreStartWarningResponse'
  /agents/c/quota:
    get:
      tags: [Agents]
      summary: 에이전트 C 오늘 사용량 조회
      responses:
        '200':
          description: quota 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentQuotaResponse'
  /notifications:
    get:
      tags: [Notifications]
      summary: 알림 목록 조회
      responses:
        '200':
          description: 알림 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
  /guides/search:
    get:
      tags: [Guides]
      summary: 부업 가이드 검색
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            enum: [POPULAR, LATEST, HELPFUL]
      responses:
        '200':
          description: 가이드 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideListResponse'
  /guides/categories:
    get:
      tags: [Guides]
      summary: 부업 가이드 카테고리 목록
      responses:
        '200':
          description: 카테고리 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideCategoryListResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ExperienceId:
      in: path
      name: experienceId
      required: true
      schema:
        type: integer
        format: int64
    CategoryId:
      in: path
      name: categoryId
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: ok
        data:
          type: object
    OAuthLoginRequest:
      type: object
      required: [code, redirectUri]
      properties:
        code:
          type: string
        redirectUri:
          type: string
          format: uri
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthPayload'
    AuthPayload:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        tokenType:
          type: string
          example: Bearer
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresIn:
          type: integer
        emailVerificationRequired:
          type: boolean
    ProviderListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                providers:
                  type: array
                  items:
                    type: string
                    enum: [KAKAO, GOOGLE, NAVER]
    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        nickname:
          type: string
        fullName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
        region:
          type: string
        signupPurpose:
          type: string
        sideHustleExperienceStatus:
          type: string
        profileImage:
          type: string
          format: uri
        authProvider:
          type: string
        emailVerified:
          type: boolean
        profileCompleted:
          type: boolean
    MeResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                user:
                  allOf:
                    - $ref: '#/components/schemas/UserSummary'
                    - type: object
                      properties:
                        interestCategories:
                          type: array
                          items:
                            $ref: '#/components/schemas/CategorySummary'
    UpdateMeRequest:
      type: object
      properties:
        nickname:
          type: string
        fullName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
        region:
          type: string
        signupPurpose:
          type: string
        sideHustleExperienceStatus:
          type: string
        profileImage:
          type: string
          format: uri
        interestCategoryIds:
          type: array
          items:
            type: integer
            format: int64
    CategorySummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CreateExperienceRequest:
      type: object
      required: [content, categoryId]
      properties:
        title:
          type: string
        content:
          type: string
        categoryId:
          type: integer
          format: int64
        businessType:
          type: string
        investmentAmount:
          type: integer
        durationMonths:
          type: integer
        weeklyHours:
          type: integer
        averageDailyHours:
          type: string
        isConcurrentWithMainJob:
          type: boolean
        monthlyRevenue:
          type: integer
        failureReason:
          type: string
        failureReasons:
          type: array
          items:
            type: string
        difficulties:
          type: array
          items:
            type: string
        difficultyEtc:
          type: string
        difficultyExtra:
          type: string
        targetMarket:
          type: string
        marketingChannels:
          type: array
          items:
            type: string
        lessonsLearned:
          type: string
        wouldRetry:
          type: boolean
        imageIds:
          type: array
          items:
            type: integer
            format: int64
    UpdateExperienceRequest:
      allOf:
        - $ref: '#/components/schemas/CreateExperienceRequest'
    ExperienceListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                experiences:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExperienceSummary'
    ExperienceSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        category:
          $ref: '#/components/schemas/CategorySummary'
        author:
          $ref: '#/components/schemas/UserSummary'
        likeCount:
          type: integer
        viewCount:
          type: integer
    ExperienceDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ExperienceSummary'
    ExperienceImageCreateRequest:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        sortOrder:
          type: integer
    ExperienceImageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                imageUrl:
                  type: string
                  format: uri
                thumbnailUrl:
                  type: string
                  format: uri
                sortOrder:
                  type: integer
    SuccessCaseListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                      title:
                        type: string
                      category:
                        $ref: '#/components/schemas/CategorySummary'
    SuccessComparisonResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                successCase:
                  type: object
                differencePoints:
                  type: array
                  items:
                    type: string
    FailurePatternResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                userCaseId:
                  type: string
                userFailurePattern:
                  type: string
                userCategory:
                  type: string
                similarFailureCount:
                  type: integer
                totalCasesInCategory:
                  type: integer
                similarityPercentage:
                  type: number
                  format: double
                comparisonText:
                  type: string
                top3Patterns:
                  type: array
                  items:
                    $ref: '#/components/schemas/FailurePatternItem'
    FailurePatternItem:
      type: object
      properties:
        rank:
          type: integer
        pattern:
          type: string
        percentage:
          type: number
          format: double
        isUserPattern:
          type: boolean
    FailureTimelineResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                category:
                  type: string
                distribution:
                  type: array
                  items:
                    $ref: '#/components/schemas/FailureTimelineItem'
                peakMonth:
                  type: integer
                peakLabel:
                  type: string
                averageDuration:
                  type: number
                  format: double
                totalCases:
                  type: integer
    FailureTimelineItem:
      type: object
      properties:
        month:
          type: integer
        label:
          type: string
        percentage:
          type: number
          format: double
        count:
          type: integer
    CategoryStatisticsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                categoryId:
                  type: integer
                  format: int64
                category:
                  type: string
                totalCases:
                  type: integer
                failureRate:
                  type: number
                  format: double
                successRate:
                  type: number
                  format: double
                failureTop3:
                  type: array
                  items:
                    $ref: '#/components/schemas/FailureTop3Item'
                successTop3:
                  type: array
                  items:
                    $ref: '#/components/schemas/FailureTop3Item'
                averageInvestment:
                  type: integer
                averageDuration:
                  type: number
                  format: double
                dropoffDistribution:
                  type: array
                  items:
                    $ref: '#/components/schemas/DropoffItem'
    AllCategoryStatisticsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CategoryStatsItem'
    CategoryStatsItem:
      type: object
      properties:
        category:
          type: string
        totalCases:
          type: integer
        failureRate:
          type: number
          format: double
        successRate:
          type: number
          format: double
    FailureTop3Item:
      type: object
      properties:
        label:
          type: string
        count:
          type: integer
        ratio:
          type: number
          format: double
    DropoffItem:
      type: object
      properties:
        month:
          type: integer
        ratio:
          type: number
          format: double
    AnalysisHistoryListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      experienceId:
                        type: integer
                        format: int64
                      analysisId:
                        type: integer
                        format: int64
                      title:
                        type: string
                      reportStatus:
                        type: string
                      processedAt:
                        type: string
                        format: date-time
    AgentAQuestionRequest:
      type: object
      required: [draftContent, categoryId]
      properties:
        draftTitle:
          type: string
        draftContent:
          type: string
        categoryId:
          type: integer
          format: int64
    AgentAQuestionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                questions:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      label:
                        type: string
                      question:
                        type: string
                      required:
                        type: boolean
    AgentCChatRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          maxLength: 500
        categoryHint:
          type: string
          enum: [commerce, content-sns, digital-product, platform-labor, talent, investment, offline]
        experienceId:
          type: integer
          format: int64
    AgentCChatResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                routeType:
                  type: string
                  enum: [PLAN_B, REACT]
                answer:
                  type: string
                citations:
                  type: array
                  items:
                    type: string
                usedTools:
                  type: array
                  items:
                    type: string
                tokenUsage:
                  type: object
                  properties:
                    todayUsed:
                      type: integer
                    todayLimit:
                      type: integer
                fallbackReason:
                  type: string
                  nullable: true
    PreStartWarningRequest:
      type: object
      required: [userDraft]
      properties:
        userDraft:
          type: string
    PreStartWarningResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                userInputKeywords:
                  type: array
                  items:
                    type: string
                missingSuccessFactors:
                  type: array
                  items:
                    type: string
                similarFailureCases:
                  type: array
                  items:
                    $ref: '#/components/schemas/SimilarFailureCaseItem'
                warningLevel:
                  type: string
                  enum: [low, medium, high]
                warningText:
                  type: string
    SimilarFailureCaseItem:
      type: object
      properties:
        caseId:
          type: string
        summary:
          type: string
        category:
          type: string
    AgentQuotaResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                todayUsed:
                  type: integer
                todayLimit:
                  type: integer
                warnThreshold:
                  type: number
                  format: double
                blockThreshold:
                  type: number
                  format: double
                planBOnly:
                  type: boolean
    NotificationListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                      type:
                        type: string
                      message:
                        type: string
                      isRead:
                        type: boolean
                      targetType:
                        type: string
