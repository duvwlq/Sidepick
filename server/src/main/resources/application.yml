spring:
  application:
    name: failforward-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/failforward?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:failforward}
    password: ${SPRING_DATASOURCE_PASSWORD:failforward}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.failforward: DEBUG

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${APP_JWT_SECRET:sidepick-development-jwt-secret-key-must-be-32-bytes}
    access-token-expiration-seconds: ${APP_JWT_ACCESS_EXPIRES:3600}
    refresh-token-expiration-seconds: ${APP_JWT_REFRESH_EXPIRES:1209600}

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:3000}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:5000}
