spring:
  application:
    name: failforward-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/failforward?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    encoding: UTF-8
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.failforward: DEBUG

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  experience-import:
    enabled: ${APP_EXPERIENCE_IMPORT_ENABLED:false}
    csv-path: ${APP_EXPERIENCE_IMPORT_CSV_PATH:}
    preserve-ids: ${APP_EXPERIENCE_IMPORT_PRESERVE_IDS:true}
    overwrite-existing: ${APP_EXPERIENCE_IMPORT_OVERWRITE_EXISTING:true}
    import-analysis: ${APP_EXPERIENCE_IMPORT_ANALYSIS:true}
    replace-mode: ${APP_EXPERIENCE_IMPORT_REPLACE_MODE:UPSERT_ONLY}
    author-mode: ${APP_EXPERIENCE_IMPORT_AUTHOR_MODE:SYSTEM}
    system-email: ${APP_EXPERIENCE_IMPORT_SYSTEM_EMAIL:imported-cases@sidepick.local}
    system-nickname: ${APP_EXPERIENCE_IMPORT_SYSTEM_NICKNAME:sidepick-import}
    pseudo-email-domain: ${APP_EXPERIENCE_IMPORT_PSEUDO_EMAIL_DOMAIN:sidepick.local}
    title-mode: ${APP_EXPERIENCE_IMPORT_TITLE_MODE:SUMMARY}
    created-at-mode: ${APP_EXPERIENCE_IMPORT_CREATED_AT_MODE:RANDOM_DISTRIBUTED}
    created-at-start: ${APP_EXPERIENCE_IMPORT_CREATED_AT_START:2025-01-01T00:00:00}
    created-at-end: ${APP_EXPERIENCE_IMPORT_CREATED_AT_END:2026-04-30T23:59:59}
    default-age-group: ${APP_EXPERIENCE_IMPORT_DEFAULT_AGE_GROUP:30s}
    default-risk-level: ${APP_EXPERIENCE_IMPORT_DEFAULT_RISK_LEVEL:MEDIUM}
    default-case-status: ${APP_EXPERIENCE_IMPORT_DEFAULT_CASE_STATUS:FAILURE}
    default-category-id: ${APP_EXPERIENCE_IMPORT_DEFAULT_CATEGORY_ID:8}
    category-map:
      "[온라인판매_이커머스]": 1
      "[콘텐츠_SNS]": 2
      "[디지털상품_지식판매]": 3
      "[플랫폼노동]": 4
      "[재능_프리랜서]": 5
      "[투자_재테크]": 6
      "[오프라인부업]": 7
      "[기타]": 8
  demo-seed:
    enabled: ${APP_DEMO_SEED_ENABLED:false}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from-address: ${APP_MAIL_FROM_ADDRESS:no-reply@side-pick.app}
    from-name: ${APP_MAIL_FROM_NAME:Sidepick}
  auth:
    local-enabled: ${APP_AUTH_LOCAL_ENABLED:true}
    kakao-enabled: ${APP_AUTH_KAKAO_ENABLED:true}
    google-enabled: ${APP_AUTH_GOOGLE_ENABLED:true}
    naver-enabled: ${APP_AUTH_NAVER_ENABLED:true}
    email-verification:
      expiration-minutes: ${APP_EMAIL_VERIFICATION_EXPIRATION_MINUTES:10}
      expose-code: ${APP_EMAIL_VERIFICATION_EXPOSE_CODE:false}
  security:
    admin-emails: ${APP_SECURITY_ADMIN_EMAILS:}
  file-storage:
    upload-dir: ${APP_FILE_STORAGE_UPLOAD_DIR:${java.io.tmpdir}/sidepick-uploads}
    public-path: ${APP_FILE_STORAGE_PUBLIC_PATH:/uploads}
    max-profile-image-bytes: ${APP_FILE_STORAGE_MAX_PROFILE_IMAGE_BYTES:5242880}
    max-experience-image-bytes: ${APP_FILE_STORAGE_MAX_EXPERIENCE_IMAGE_BYTES:10485760}
  share:
    web-base-url: ${APP_SHARE_WEB_BASE_URL:http://localhost:5173}
    public-base-url: ${APP_SHARE_PUBLIC_BASE_URL:http://localhost:8081}
  agent-c:
    prompt-path: ${AGENT_C_PROMPT_PATH:ai/prompts/AI-04-agent_c_v1.md}
  agent-a:
    timeout-sec: ${AGENT_A_TIMEOUT_SEC:10}
    rate-limit-per-min: ${AGENT_A_RATE_LIMIT_PER_MIN:5}
  analysis-cache:
    ttl-hours: ${APP_ANALYSIS_CACHE_TTL_HOURS:24}
    max-entries: ${APP_ANALYSIS_CACHE_MAX_ENTRIES:1000}
  chatbot:
    rate-limit-per-min: ${APP_CHATBOT_RATE_LIMIT_PER_MIN:10}
    max-message-length: ${APP_CHATBOT_MAX_MESSAGE_LENGTH:500}
    minimum-guide-message-length: ${APP_CHATBOT_MIN_GUIDE_MESSAGE_LENGTH:50}
    queue-capacity: ${APP_CHATBOT_QUEUE_CAPACITY:20}
    daily-token-limit: ${APP_CHATBOT_DAILY_TOKEN_LIMIT:12000}
  latency-metrics:
    max-samples-per-endpoint: ${APP_LATENCY_METRICS_MAX_SAMPLES_PER_ENDPOINT:200}
    max-endpoints: ${APP_LATENCY_METRICS_MAX_ENDPOINTS:128}
  stats:
    failure-pattern-path: ${APP_STATS_FAILURE_PATTERN_PATH:ai/data/failure_pattern.json}
    failure-timing-path: ${APP_STATS_FAILURE_TIMING_PATH:ai/data/failure_timing.json}
    minimum-sufficient-sample: ${APP_STATS_MINIMUM_SUFFICIENT_SAMPLE:10}
  oauth:
    kakao:
      client-id: ${APP_OAUTH_KAKAO_CLIENT_ID:}
      client-secret: ${APP_OAUTH_KAKAO_CLIENT_SECRET:}
    google:
      client-id: ${APP_OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${APP_OAUTH_GOOGLE_CLIENT_SECRET:}
    naver:
      client-id: ${APP_OAUTH_NAVER_CLIENT_ID:}
      client-secret: ${APP_OAUTH_NAVER_CLIENT_SECRET:}
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-expiration-seconds: ${APP_JWT_ACCESS_EXPIRES:3600}
    refresh-token-expiration-seconds: ${APP_JWT_REFRESH_EXPIRES:1209600}

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8001}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:3000}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:10000}
