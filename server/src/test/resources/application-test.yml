spring:
  datasource:
    url: jdbc:h2:mem:sidepick-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: sidepick-test-jwt-secret-key-must-be-32bytes
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600

ai:
  server:
    url: http://localhost:8000
    connect-timeout: 100
    read-timeout: 100

logging:
  level:
    root: WARN
    com.failforward: INFO
