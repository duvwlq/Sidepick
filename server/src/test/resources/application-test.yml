spring:
  datasource:
    url: jdbc:h2:mem:sidepick-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173
  analysis-cache:
    ttl-hours: 24
    max-entries: 100
  auth:
    email-verification:
      expose-code: true
  chatbot:
    rate-limit-per-min: 10
    max-message-length: 500
    minimum-guide-message-length: 50
    queue-capacity: 4
    daily-token-limit: 2000
  stats:
    failure-pattern-path: ai/data/failure_pattern.json
    failure-timing-path: ai/data/failure_timing.json
    minimum-sufficient-sample: 10
  latency-metrics:
    max-samples-per-endpoint: 50
    max-endpoints: 32
  security:
    admin-emails: admin@sidepick.dev
  file-storage:
    upload-dir: ${java.io.tmpdir}/sidepick-test-uploads
    public-path: /uploads
    max-profile-image-bytes: 1048576
  share:
    web-base-url: http://localhost:4173
    public-base-url: http://localhost:8081
  jwt:
    secret: sidepick-test-jwt-secret-key-must-be-32bytes
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600

ai:
  server:
    url: http://localhost:8001
    connect-timeout: 100
    read-timeout: 100

logging:
  level:
    root: WARN
    com.failforward: INFO
